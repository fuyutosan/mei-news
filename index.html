  { date:"2026-05-28", file:"mei_newsletter_2026-05-28.html", title:"創刊号", emoji:"🎉" },
];

const WD = ['日','月','火','水','木','金','土'];
function fmtDate(s) {
  const d = new Date(s + 'T00:00:00+09:00');
  return { full: (d.getMonth()+1) + '月' + d.getDate() + '日', wd: WD[d.getDay()] };
}

// 最新号ヒーロー
(function(){
  const latest = ISSUES[0];
  const f = fmtDate(latest.date);
  document.getElementById('hero-card').href = latest.file;
  document.getElementById('hero-issue').textContent = '第' + (ISSUES.length) + '号 ／ ' + latest.date.slice(0,4) + '年';
  document.getElementById('hero-date').textContent = f.full + '（' + f.wd + '）';
  document.getElementById('hero-title').textContent = latest.title || 'きょうのめいちゃんニュース';
})();

// バックナンバーグリッド（最新号以外）
(function(){
  const grid = document.getElementById('archive-grid');
  ISSUES.slice(1).forEach(it => {
    const f = fmtDate(it.date);
    const a = document.createElement('a');
    a.href = it.file;
    a.className = 'archive-card';
    a.innerHTML =
      '<div class="archive-emoji">' + (it.emoji || '🐼') + '</div>' +
      '<div class="archive-date">' + f.full + '</div>' +
      '<div class="archive-weekday">（' + f.wd + '）</div>' +
      (it.title ? '<div class="archive-sub">' + it.title + '</div>' : '');
    grid.appendChild(a);
  });
})();

// スクロールフェードイン
(function(){
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.06 });
  document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
})();

// カーソル追従パンダさん
(function(){
  const el = document.getElementById('cursor-panda');
  if (!el || window.matchMedia('(hover: none)').matches) return;
  document.addEventListener('mousemove', e => {
    el.style.left = e.clientX + 'px';
    el.style.top  = e.clientY + 'px';
  });
})();

// クリックでハート＆竹が飛び散る
(function(){
  const emojis = ['💚','🎋','🐼','🌿','✨','💚','🎋','⭐'];
  document.addEventListener('click', e => {
    for (let i = 0; i < 9; i++) {
      const el = document.createElement('span');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const size = 14 + Math.random() * 18;
      el.style.cssText = 'position:fixed;left:' + e.clientX + 'px;top:' + e.clientY + 'px;font-size:' + size + 'px;pointer-events:none;z-index:9998;transition:transform .7s ease-out,opacity .7s ease-out;opacity:1;';
      document.body.appendChild(el);
      const angle = Math.random() * Math.PI * 2;
      const dist  = 35 + Math.random() * 70;
      requestAnimationFrame(() => {
        el.style.transform = 'translate(' + (Math.cos(angle)*dist) + 'px,' + (Math.sin(angle)*dist - 40) + 'px)';
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 750);
    }
  });
})();
</script>
</body>
