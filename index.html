<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐼 デイリーめいちゃんニュース</title>
<style>
  body { font-family: 'Hiragino Maru Gothic ProN', sans-serif; background: #fff9f0; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
  h1 { color: #ff7eb3; text-align: center; }
  ul { list-style: none; padding: 0; }
  li { background: white; margin: 8px 0; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  a { color: #ff7eb3; text-decoration: none; font-weight: bold; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>🐼 デイリーめいちゃんニュース</h1>
<p style="text-align:center">山﨑愛生ちゃんの毎朝お届けニュース</p>
<ul id="list"></ul>
<script>
const issues = [
  // 自動追加されます
  { date: "2026-05-28", issue: "001", file: "mei_newsletter_2026-05-28.html" },
];
const ul = document.getElementById('list');
[...issues].reverse().forEach(i => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="${i.file}">📰 第${i.issue}号 (${i.date})</a>`;
  ul.appendChild(li);
});
</script>
</body>
</html>
